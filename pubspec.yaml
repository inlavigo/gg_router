name: gg_router
description: Create nested routes. Sync app state and browser URL. Navigate absolutely and relatively. Animate route transitions. Save and restore state. Manage URI query parameters.

version: 3.3.0
repository: https://github.com/inlavigo/gg_router

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  gg_value: ^1.8.0
  gg_once_per_cycle: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  gg_easy_widget_test: ^1.3.0
  lints: ^6.1.0
  args: ^2.7.0
  dna_ggsuite: ^0.2.0
  helix: ^1.3.0